name: Unzip and Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # خطوة فك الضغط والبحث الشامل عن ملفات المشروع ونقلها للمسار الصحيح
    - name: Unzip and Locate Project Root
      run: |
        unzip -o glass_notification_project.zip -d ./extracted_files
        
        # البحث عن المجلد الذي يحتوي على ملف gradlew الحقيقي
        GRADLEW_PATH=$(find ./extracted_files -name gradlew -type f -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ خطأ: لم يتم العثور على ملف gradlew في الملف المضغوط!"
          exit 1
        fi
        
        # الحصول على اسم المجلد الرئيسي للمشروع ونقل محتوياته للمجلد الحالي للسيرفر
        PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
        echo "✅ تم العثور على المشروع في المسار: $PROJECT_ROOT"
        
        mv "$PROJECT_ROOT"/* ./
        
        # نقل الملفات المخفية (مثل .gradle إن وجدت)
        find "$PROJECT_ROOT" -maxdepth 1 -name ".*" -not -name "." -not -name ".." -exec mv {} ./ \;
        
        # تنظيف المجلدات المؤقتة والملف المضغوط لتهيئة بيئة البناء
        rm -rf extracted_files glass_notification_project.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject Google Repositories into Settings
      run: |
        if [ -f "settings.gradle" ]; then
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > temp_settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> temp_settings.gradle
          cat settings.gradle >> temp_settings.gradle
          mv temp_settings.gradle settings.gradle
        fi

    - name: Fix Permissions for Gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Glass-Notification-App
        path: app/build/outputs/apk/debug/app-debug.apk
