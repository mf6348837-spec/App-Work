name: Generate Wrapper and Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. فك ضغط ملفات الأكواد البرمجية مباشرة إلى المجلد الرئيسي
    - name: Unzip Project Files
      run: |
        unzip -o glass_notification_project.zip -d ./
        
        # إذا كانت الملفات بداخل مجلد فرعي، نخرجها للمجلد الرئيسي
        if [ -d "./extracted_files" ]; then
          mv ./extracted_files/* ./
          rm -rf extracted_files
        fi
        rm -f glass_notification_project.zip

    # 2. تهيئة بيئة الجافا المطلوبة للأندرويد
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. خطوة سحرية: توليد ملفات gradlew ونظام التشغيل المفقودة تلقائياً عبر السيرفر
    - name: Generate Missing Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.2

    # 4. إصلاح مستودعات البحث لتنزيل حزم الأندرويد من سيرفرات جوجل الرسمية
    - name: Inject Google Repositories into Settings
      run: |
        if [ -f "settings.gradle" ]; then
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > temp_settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> temp_settings.gradle
          cat settings.gradle >> temp_settings.gradle
          mv temp_settings.gradle settings.gradle
        fi

    # 5. إعطاء صلاحية التشغيل لملف gradlew الذي تم توليده
    - name: Fix Permissions for Gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 6. تجميع التطبيق وبناء الـ APK
    - name: Build Android APK
      run: ./gradlew assembleDebug --no-daemon

    # 7. رفع ملف الـ APK الجاهز لتنزيله على هاتفك
    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Glass-Notification-App
        path: app/build/outputs/apk/debug/app-debug.apk
