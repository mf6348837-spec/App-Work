name: Unzip and Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # خطوة فك الضغط الذكية ونقل الملفات للمجلد الرئيسي
    - name: Unzip Project Files
      run: |
        unzip -o glass_notification_project.zip -d ./temp_project
        if [ -d "./temp_project/glass_notification_project" ]; then
          mv ./temp_project/glass_notification_project/* ./
        else
          mv ./temp_project/* ./
        fi
        rm -rf temp_project glass_notification_project.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject Google Repositories into Settings
      run: |
        if [ -f "settings.gradle" ]; then
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > temp_settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> temp_settings.gradle
          cat settings.gradle >> temp_settings.gradle
          mv temp_settings.gradle settings.gradle
        fi

    - name: Fix Permissions for Gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Glass-Notification-App
        path: app/build/outputs/apk/debug/app-debug.apk
